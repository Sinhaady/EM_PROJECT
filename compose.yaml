services:
  backend:
    build:
      context: ./server
    env_file:
      - ./server/.env
    environment:
      PORT: 5000
      # Browser-facing URLs must point at nginx, not the backend container port.
      CLIENT_URL: ${PUBLIC_URL:-http://localhost:3000}
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:3000}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/api/auth/google/callback}
    expose:
      - "5000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5000/api/health').then(response => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    ports:
      - "${PUBLIC_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
